<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<link rel="manifest" href="/manifest.webmanifest">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--bg:#050b16;--panel:#08182a;--line:#12456b;--c:#22e4ff;--text:#d8f4ff;--dim:#7fa6bd;--hot:#ff8a1f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 18%,#073049 0%,var(--bg) 62%);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:var(--c);background:transparent;border:1px solid var(--line);border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.corner{position:fixed;width:18px;height:18px;border:2px solid var(--c);opacity:.6;pointer-events:none}
.tl{top:6px;left:6px;border-right:0;border-bottom:0}.tr{top:6px;right:6px;border-left:0;border-bottom:0}
.bl{bottom:6px;left:6px;border-right:0;border-top:0}.br{bottom:6px;right:6px;border-left:0;border-top:0}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;gap:8px}
h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.35em;color:var(--c)}
.hb{display:flex;gap:6px}.hb button{padding:7px 11px;font-size:14px}
main{flex:1;overflow-y:auto;padding:0 16px 14px;scroll-behavior:smooth}
.stage{text-align:center;padding-top:6px}
#orb{width:min(96vw,372px);aspect-ratio:1;margin:0 auto;cursor:pointer;touch-action:manipulation}
#orb canvas{width:100%;height:100%;display:block}
#status{color:var(--dim);min-height:22px;font-size:15px;padding:0 8px}
#wake{margin:8px 0 14px;padding:9px 18px;border-radius:22px;font-size:15px}
#wake.on{background:#0a3552;border-color:var(--c);box-shadow:0 0 14px #22e4ff55}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#0a1b30aa;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--text)}
.card small{display:block;color:var(--dim);font-size:13px}.card b{display:block;font-size:24px;font-weight:500;margin:6px 0 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}.chips button{white-space:nowrap;padding:9px 15px}
blockquote{margin:14px 0;padding:2px 0 2px 12px;border-left:2px solid var(--c)}blockquote small{color:var(--dim);display:block;font-size:13px}
#chat{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.m{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:#0e2b45}.j{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;margin:0 14px;padding:8px 8px 8px 8px;margin-bottom:calc(env(safe-area-inset-bottom) + 10px);border:1px solid var(--line);border-radius:30px;background:#06121f}
.bar input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font:inherit;padding:8px 4px}
.bar input::placeholder{color:var(--dim)}
.rd{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;padding:0}
#mic{background:#0a3552}#mic.hot{color:#fff;background:var(--hot);border-color:var(--hot)}
#send{background:var(--c);color:#031018;border-color:var(--c)}
#sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}#sheet.show{display:flex}
#sheet>div{width:100%;max-height:75%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.n{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #12456b66}.n button{padding:2px 10px}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}
</style>
</head>
<body>
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<header><h1>JARVIS</h1><div class="hb"><button id="bVoice">Voice on</button><button id="bLang">HI</button><button id="bClear">Clear</button></div></header>
<main id="main">
 <section class="stage">
  <div id="orb" role="button" tabindex="0" aria-label="Bolne ke liye orb dabao"><canvas id="cv"></canvas></div>
  <div id="status">System online</div>
  <button id="wake" aria-pressed="false">Hey Jarvis mode: OFF</button>
 </section>
 <section class="cards">
  <div class="card"><small>Time</small><b id="cT">--:--</b><small id="cD">Loading</small></div>
  <button class="card" id="cW"><small>Weather</small><b id="cWv">--</b><small id="cWs">Tap to enable</small></button>
  <div class="card"><small>Battery</small><b id="cB">--</b><small id="cBs">Checking</small></div>
  <button class="card" id="cN"><small>Notes</small><b id="cNv">0</b><small>Tap to open</small></button>
 </section>
 <div class="chips" id="chips"></div>
 <blockquote><small>Quote of the day</small><span id="quote"></span></blockquote>
 <section id="chat" aria-live="polite"></section>
</main>
<form class="bar" id="form">
 <button type="button" id="mic" class="rd" aria-label="Bolo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
 <input id="txt" placeholder="Jarvis se kuch bhi pucho..." autocomplete="off" enterkeyhint="send">
 <button type="submit" id="send" class="rd" aria-label="Bhejo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
</form>
<div id="sheet"><div><b>Notes</b><div id="nl"></div><button id="nClose" style="margin-top:12px;padding:8px 16px">Band karo</button></div></div>

<script>
const $ = id => document.getElementById(id);
const orb = $('orb'), cv = $('cv'), ctx = cv.getContext('2d'), statusEl = $('status');
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= ORB ================= */
/* ===== ORB: movie hologram. Idle = cyan, sirf SUNTE waqt orange ===== */
const IDLE = [34, 228, 255], HOT = [255, 122, 20], BRIGHT = [255, 190, 80];
let cur = IDLE.slice(), state = 'idle', voice = 0, voiceT = 0, rings = [];
function setOrb(s, text){ state = s; if (text) statusEl.textContent = text; }
const rnd = Math.random, gauss = () => rnd()+rnd()+rnd()+rnd()-2;
const unit = () => { const x=gauss(), y=gauss(), z=gauss(), l=Math.hypot(x,y,z)||1; return [x/l,y/l,z/l]; };
const norm = v => { const l = Math.hypot(...v)||1; return [v[0]/l, v[1]/l, v[2]/l]; };
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const perp = p => { const r=unit(), d=r[0]*p[0]+r[1]*p[1]+r[2]*p[2]; return norm([r[0]-d*p[0], r[1]-d*p[1], r[2]-d*p[2]]); };
const SH = [], CO = [], ARCS = [];
const add = (g,p,t,r,len,w) => g.push({p, t, r, len, w: w||0, ph: rnd()*6.28});

for (let i=0;i<1000;i++){ const p=unit(); add(SH, p, perp(p), 1-0.22*Math.pow(rnd(),2), 0.012+0.045*rnd()); }        // bareek shell
for (let i=0;i<190;i++){ const p=unit(); add(SH, p, perp(p), 1.04+0.16*rnd(), 0.006+0.012*rnd()); }                 // bahar udti dhool
for (let b=0;b<7;b++){                                                                                               // scan-bands (toote hue rings)
  const a=unit(), u=perp(a), v=cross(a,u), h=(rnd()-.5)*1.3, rr=Math.sqrt(1-h*h), a0=rnd()*6.28, span=3+rnd()*3.2;
  for (let i=0;i<170;i++){
    const th=a0+span*rnd(), c=Math.cos(th), s=Math.sin(th);
    const p=[a[0]*h+(u[0]*c+v[0]*s)*rr, a[1]*h+(u[1]*c+v[1]*s)*rr, a[2]*h+(u[2]*c+v[2]*s)*rr];
    const circ=[-u[0]*s+v[0]*c, -u[1]*s+v[1]*c, -u[2]*s+v[2]*c];
    const dash = rnd()<.5 ? circ : norm([a[0]-p[0]*h, a[1]-p[1]*h, a[2]-p[2]*h]);
    add(SH, p, dash, 0.9+0.1*rnd(), rnd()<.5 ? 0.03+0.1*rnd() : 0.015+0.04*rnd(), rnd()<.3 ? 1 : 0);
  }
}
for (let k=0;k<9;k++){                                                                                               // andar ke patle arcs
  const a=unit(), u=perp(a), v=cross(a,u), R=0.45+0.5*rnd(), a0=rnd()*6.28, span=1.6+rnd()*3.4, pts=[];
  for (let i=0;i<=40;i++){ const th=a0+span*i/40, c=Math.cos(th), s=Math.sin(th); pts.push([(u[0]*c+v[0]*s)*R,(u[1]*c+v[1]*s)*R,(u[2]*c+v[2]*s)*R]); }
  ARCS.push(pts);
}
(function(){                                                                                                         // chamakta spiral core
  const tilt=1.0, ct=Math.cos(tilt), st=Math.sin(tilt), tf=v=>[v[0], v[1]*ct-v[2]*st, v[1]*st+v[2]*ct];
  for (let i=0;i<460;i++){
    const arm=i%4, u=Math.pow(rnd(),.8), th=arm*1.5708+u*5.5+gauss()*.12, rad=0.04+0.36*u;
    const p=tf([rad*Math.cos(th), rad*Math.sin(th), gauss()*.2*(1-u*.4)]);
    const dx=0.36*.8*Math.cos(th)-rad*Math.sin(th)*5.5, dy=0.36*.8*Math.sin(th)+rad*Math.cos(th)*5.5;
    add(CO, p, norm(tf([dx,dy,0])), 1, 0.03+0.07*rnd(), rnd()<.35 ? 1 : 0);
  }
})();

/* ---- neuron network (halka, background mein) ---- */
const NODES = [], EDGES = [], ADJ = [], PULSES = [];
for (let i=0;i<115;i++){
  const p=unit(), core=i>=75&&i<95, out=i>=95, r=core?0.06+0.28*rnd():out?1.06+0.14*rnd():0.72+0.26*rnd();
  NODES.push({v:[p[0]*r,p[1]*r,p[2]*r], ph:rnd()*6.28, fl:0, core, out}); ADJ.push([]);
}
const seen = new Set();
const link = (a,b) => { const k=a<b?a+'_'+b:b+'_'+a; if (a===b||seen.has(k)) return; seen.add(k); EDGES.push([a,b]); ADJ[a].push(EDGES.length-1); ADJ[b].push(EDGES.length-1); };
NODES.forEach((n,i) => {
  const d=NODES.map((m,j)=>[j,(n.v[0]-m.v[0])**2+(n.v[1]-m.v[1])**2+(n.v[2]-m.v[2])**2]).filter(x=>x[0]!==i&&!NODES[x[0]].out).sort((a,b)=>a[1]-b[1]);
  d.slice(0, n.core||n.out?2:3).forEach(x=>link(i,x[0]));
  if (n.core){ const sh=d.find(x=>!NODES[x[0]].core); if (sh) link(i,sh[0]); }
});
const fire = (e,from) => { if (PULSES.length<70) PULSES.push({e, from, t:0, sp:1.1+rnd()*1.2}); };

/* ---- render ---- */
let size=300, dpr=1, t0=performance.now(), spin=0, amp=.02, core=1, still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){ dpr=Math.min(window.devicePixelRatio||1,2); size=orb.clientWidth||300; cv.width=cv.height=Math.round(size*dpr); }
resize(); addEventListener('resize', resize);
const BK = 4, f = 3.2;
const mat = (ry,rx,rz) => ({cy:Math.cos(ry),sy:Math.sin(ry),cx:Math.cos(rx),sx:Math.sin(rx),cz:Math.cos(rz),sz:Math.sin(rz)});
function proj(x,y,z,M,c,R){ let t=x*M.cy+z*M.sy; z=-x*M.sy+z*M.cy; x=t; t=y*M.cx-z*M.sx; z=y*M.sx+z*M.cx; y=t; t=x*M.cz-y*M.sz; y=x*M.sz+y*M.cz; x=t; const k=f/(f-z); return [c+x*k*R, c+y*k*R, z]; }

function frame(now){
  const dt=Math.min((now-t0)/1000,.05); t0=now; const tm=now/1000;
  voice += (voiceT-voice)*.18;
  const hot=HOT.map((v,i)=>v+(BRIGHT[i]-v)*voice);
  const tgt = state==='listening' ? {s:1.5+voice*2.2,a:.05+voice*.08,c:1.3+voice*.9,col:hot}
            : state==='thinking' ? {s:2.6,a:.05,c:1.3,col:IDLE}
            : state==='speaking' ? {s:1.2,a:.04,c:1.2,col:IDLE}
            : {s:window.armed?.9:.5,a:.02,c:1,col:IDLE};
  spin += dt*tgt.s*(still?0:1); amp += (tgt.a-amp)*.08; core += (tgt.c-core)*.08;
  for (let i=0;i<3;i++) cur[i] += (tgt.col[i]-cur[i])*.08;
  const rgb=cur.map(Math.round).join(',');
  const W=cv.width, c=W/2, R=c*0.64;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,W); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';

  // glow: bahar halka + beech tez
  let g=ctx.createRadialGradient(c,c,R*.5,c,c,R*1.3); g.addColorStop(0,`rgba(${rgb},.07)`); g.addColorStop(1,`rgba(${rgb},0)`); ctx.fillStyle=g; ctx.fillRect(0,0,W,W);
  g=ctx.createRadialGradient(c,c,0,c,c,R*.6*core); g.addColorStop(0,`rgba(${rgb},.9)`); g.addColorStop(.3,`rgba(${rgb},.3)`); g.addColorStop(1,`rgba(${rgb},0)`); ctx.fillStyle=g; ctx.fillRect(0,0,W,W);

  // bahar ki dial rings (HUD)
  ctx.lineWidth=1.4*dpr; ctx.strokeStyle=`rgba(${rgb},.3)`; ctx.setLineDash([2*dpr,7*dpr]); ctx.lineDashOffset=-spin*40*dpr; ctx.beginPath(); ctx.arc(c,c,R*1.2,0,6.283); ctx.stroke();
  ctx.strokeStyle=`rgba(${rgb},.18)`; ctx.setLineDash([26*dpr,14*dpr]); ctx.lineDashOffset=spin*60*dpr; ctx.beginPath(); ctx.arc(c,c,R*1.3,0,6.283); ctx.stroke(); ctx.setLineDash([]);

  const rx=.5+.15*Math.sin(spin*.17), MS=mat(spin*.3,rx,.2), MC=mat(-spin*.9,rx,.2);
  const breathe = (q,k) => 1 + amp*k*Math.sin(tm*(state==='idle'?1.5:5)+q.ph*3);

  function group(list, M, aBase, lw, k){
    const paths=[]; for (let i=0;i<BK*2;i++) paths.push(new Path2D());
    for (const q of list){
      const s=q.r*breathe(q,k), px=q.p[0]*s, py=q.p[1]*s, pz=q.p[2]*s, tx=q.t[0]*q.len, ty=q.t[1]*q.len, tz=q.t[2]*q.len;
      const a=proj(px+tx,py+ty,pz+tz,M,c,R), b=proj(px-tx,py-ty,pz-tz,M,c,R), zn=Math.max(-1,Math.min(1,a[2]/(s||1)));
      const score=.55*(1-Math.abs(zn))+.45*(zn+1)/2, bi=Math.min(BK-1,Math.floor(score*BK)), P=paths[q.w*BK+bi];
      P.moveTo(a[0],a[1]); P.lineTo(b[0],b[1]);
    }
    for (let w=0;w<2;w++) for (let i=0;i<BK;i++){ ctx.strokeStyle=`rgba(${rgb},${aBase+i*.1+w*.08})`; ctx.lineWidth=(lw+i*.25+w*.9)*dpr; ctx.stroke(paths[w*BK+i]); }
  }
  group(SH, MS, .13, .6, 1);
  // patle arcs
  ctx.lineWidth=.9*dpr; ctx.strokeStyle=`rgba(${rgb},.38)`; ctx.beginPath();
  for (const pts of ARCS){ pts.forEach((v,i)=>{ const p=proj(v[0],v[1],v[2],MS,c,R); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }); } ctx.stroke();
  group(CO, MC, .3, .8, .5);

  // neuron network (halka)
  const NP=NODES.map(n=>proj(n.v[0]*(1+amp*.8*Math.sin(tm*4+n.ph)),n.v[1]*(1+amp*.8*Math.sin(tm*4+n.ph)),n.v[2]*(1+amp*.8*Math.sin(tm*4+n.ph)),MS,c,R));
  const eb=[new Path2D(),new Path2D()];
  for (const [a,b] of EDGES){ const A=NP[a],B=NP[b],p=eb[(A[2]+B[2])>0?1:0]; p.moveTo(A[0],A[1]); p.lineTo(B[0],B[1]); }
  ctx.strokeStyle=`rgba(${rgb},.12)`; ctx.lineWidth=.9*dpr; ctx.stroke(eb[0]); ctx.strokeStyle=`rgba(${rgb},.3)`; ctx.lineWidth=1.1*dpr; ctx.stroke(eb[1]);
  const rate = state==='listening' ? 10+voice*55 : state==='thinking' ? 40 : state==='speaking' ? 14 : window.armed ? 5 : 2.5;
  if (rnd()<rate*dt) fire((rnd()*EDGES.length)|0,-1);
  for (let i=PULSES.length-1;i>=0;i--){
    const p=PULSES[i], [a,b]=EDGES[p.e], from=p.from===b?b:a, to=from===a?b:a; p.t+=dt*p.sp;
    if (p.t>=1){ NODES[to].fl=1; PULSES.splice(i,1); ADJ[to].filter(e=>e!==p.e).forEach(e=>{ if (rnd()<(state==='idle'?.35:.6)) fire(e,to); }); continue; }
    const A=NP[from],B=NP[to], x=A[0]+(B[0]-A[0])*p.t, y=A[1]+(B[1]-A[1])*p.t, sz=1*dpr;
    ctx.fillStyle=`rgba(${rgb},.2)`; ctx.beginPath(); ctx.arc(x,y,sz*2,0,6.283); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x,y,sz,0,6.283); ctx.fill();
  }
  NODES.forEach((n,i)=>{ n.fl*=Math.pow(.02,dt); const q=NP[i], r=(.9+n.fl*1+(q[2]+1)*.4)*dpr;
    ctx.fillStyle=`rgba(${rgb},${.15+n.fl*.3})`; ctx.beginPath(); ctx.arc(q[0],q[1],r*1.7,0,6.283); ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${.5+n.fl*.5})`; ctx.beginPath(); ctx.arc(q[0],q[1],r,0,6.283); ctx.fill(); });

  // awaaz ki lehar
  rings=rings.filter(r=>now-r<900);
  for (const r of rings){ const k=(now-r)/900; ctx.strokeStyle=`rgba(${rgb},${.6*(1-k)})`; ctx.lineWidth=2*dpr; ctx.beginPath(); ctx.arc(c,c,R*(.3+.9*k),0,6.283); ctx.stroke(); }
  ctx.fillStyle=`rgba(255,255,255,${.4*core})`; ctx.beginPath(); ctx.arc(c,c,R*.03*core,0,6.283); ctx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function orbState(s){ setOrb(s); }

/* ================= STATE ================= */
const S = {voice: store.get('voice', true), lang: store.get('lang', 'hi-IN'), wake: false};
let hist = store.get('hist', []), busy = false, active = false, ptt = false, activeTimer = null, fails = 0, lastWeather = null;
const idleText = () => S.wake ? 'Hey Jarvis bolo...' : 'Orb dabao aur bolo';
const setStatus = t => statusEl.textContent = t;
function rest(){ window.armed = S.wake; orbState('idle'); setStatus(idleText()); }

/* ================= CHAT UI ================= */
function addMsg(cls, t){ const d=document.createElement('div'); d.className='m '+cls; d.textContent=t; $('chat').appendChild(d); d.scrollIntoView({block:'end'}); return d; }
hist.slice(-6).forEach(m => addMsg(m.role==='user'?'u':'j', m.content));
const saveHist = () => { hist = hist.slice(-20); store.set('hist', hist); };

/* ================= SPEECH OUT ================= */
function speak(text){
  return new Promise(res => {
    if (!S.voice || !('speechSynthesis' in window)) return res();
    speechSynthesis.cancel(); orbState('speaking'); setStatus('Bol raha hoon... (rokne ke liye orb dabao)');
    const parts = text.replace(/[*#_`]/g,'').match(/[^.!?।\n]+[.!?।]*/g) || [text];
    const voices = speechSynthesis.getVoices(), v = voices.find(x => x.lang === S.lang) || voices.find(x => x.lang.startsWith(S.lang.slice(0,2)));
    let done = false; const fin = () => { if (!done){ done = true; clearTimeout(wd); res(); } };
    const wd = setTimeout(fin, text.length*110 + 4000);
    parts.forEach((p,i) => { const u = new SpeechSynthesisUtterance(p.trim()); u.lang = S.lang; u.pitch = .9; if (v) u.voice = v;
      if (i === parts.length-1){ u.onend = fin; u.onerror = fin; } speechSynthesis.speak(u); });
  });
}
let ac; function chime(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination);
  o.frequency.setValueAtTime(660,ac.currentTime); o.frequency.exponentialRampToValueAtTime(990,ac.currentTime+.12); g.gain.setValueAtTime(.15,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2); o.start(); o.stop(ac.currentTime+.2);}catch(e){} }
