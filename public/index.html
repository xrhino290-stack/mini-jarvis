<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Jarvis</title>
<style>
:root{--bg:#0b1220;--panel:#131b2b;--line:#222d42;--text:#e6e9ee;--mute:#8793a6;--accent:#4a9fc0;--user:#1b2a3d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg) radial-gradient(ellipse 70% 240px at 50% 0,rgba(45,110,160,.22),rgba(45,110,160,0) 100%) no-repeat;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600}
header small{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px}
.tools{display:flex;gap:8px}
.ib{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.ib.on{color:var(--text);border-color:var(--accent)}
.orbwrap{display:flex;justify-content:center;padding:14px 0 6px}
.orb{width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;opacity:.85;transition:.3s}
.orb i{width:22px;height:22px;border-radius:50%;background:var(--accent);display:block;transition:.3s}
.orb.listen{animation:pulse 1.2s ease-in-out infinite}
.orb.think{animation:spin 1.4s linear infinite;border-style:dashed}
.orb.speak i{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
@keyframes spin{to{transform:rotate(360deg)}}
.status{text-align:center;color:var(--mute);font-size:12px;min-height:16px;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip:active{border-color:var(--accent)}
#chat{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;color:var(--mute);font-size:14px;text-align:center;line-height:1.5}
.m{max-width:85%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
.m.j{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.err{color:#e0a3a3}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--bg)}
.bar input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:12px 16px;font-size:15px;outline:none}
.bar input:focus{border-color:var(--accent)}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.rb.send{background:var(--accent);border-color:var(--accent);color:#06121a}
.rb.rec{border-color:var(--accent);color:var(--accent)}
.rb svg{width:20px;height:20px;fill:currentColor}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Jarvis<small>Personal assistant</small></h1>
  <div class="tools">
    <button class="ib on" id="voiceBtn">Voice on</button>
    <button class="ib" id="clearBtn">Clear</button>
  </div>
</header>

<div class="orbwrap"><div class="orb" id="orb"><i></i></div></div>
<div class="status" id="status">Ready</div>

<div class="chips">
  <button class="chip" data-c="time">Time</button>
  <button class="chip" data-c="date">Date</button>
  <button class="chip" data-c="weather">Weather</button>
  <button class="chip" data-c="battery">Battery</button>
  <button class="chip" data-c="notes">Notes</button>
  <button class="chip" data-c="motivation">Motivation</button>
</div>

<div id="chat"></div>

<div class="bar">
  <button class="rb" id="mic" aria-label="Speak"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
  <input id="inp" type="text" placeholder="Jarvis se kuch bhi pucho" autocomplete="off">
  <button class="rb send" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
</div>

<script>
(function () {
  var chat = document.getElementById('chat');
  var inp = document.getElementById('inp');
  var orb = document.getElementById('orb');
  var statusEl = document.getElementById('status');
  var micBtn = document.getElementById('mic');
  var voiceBtn = document.getElementById('voiceBtn');
  var history = [];
  var voiceOn = true;
  var busy = false;
  var audioEl = null;

  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }

  function setState(s, t) {
    orb.className = 'orb' + (s ? ' ' + s : '');
    statusEl.textContent = t || 'Ready';
  }

  function render() {
    chat.innerHTML = '';
    if (!history.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Kuch bhi pucho ya upar se ek command chuno.';
      chat.appendChild(e);
      return;
    }
    history.forEach(function (h) { addBubble(h.role, h.text, h.err); });
    chat.scrollTop = chat.scrollHeight;
  }

  function addBubble(role, text, err) {
    var d = document.createElement('div');
    d.className = 'm ' + (role === 'user' ? 'u' : 'j') + (err ? ' err' : '');
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function push(role, text, err) {
    if (history.length === 0) chat.innerHTML = '';
    history.push({ role: role, text: text, err: !!err });
    if (history.length > 40) history = history.slice(-40);
    addBubble(role, text, err);
    store('jarvis_chat', history);
  }

  function stopAudio() {
    if (audioEl) { try { audioEl.pause(); } catch (e) {} audioEl = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function browserSpeak(text) {
    if (!window.speechSynthesis) { setState('', 'Ready'); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN';
    u.onstart = function () { setState('speak', 'Speaking'); };
    u.onend = u.onerror = function () { setState('', 'Ready'); };
    window.speechSynthesis.speak(u);
  }

  function b64ToBytes(b64) {
    var bin = atob(b64), n = bin.length, arr = new Uint8Array(n);
    for (var i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function pcmToWav(pcm, rate) {
    var buf = new ArrayBuffer(44 + pcm.length), v = new DataView(buf);
    function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.length, true);
    new Uint8Array(buf, 44).set(pcm);
    return new Blob([buf], { type: 'audio/wav' });
  }

  function speak(text) {
    if (!voiceOn || !text) { setState('', 'Ready'); return; }
    stopAudio();
    fetch('/.netlify/functions/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text.slice(0, 600) })
    }).then(function (r) {
      if (!r.ok) throw new Error('tts ' + r.status);
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('audio') === 0) return r.blob();
      return r.json().then(function (j) {
        var b64 = j.audio || j.audioContent || j.data;
        if (!b64) throw new Error('no audio');
        var mime = j.mimeType || j.mime || 'audio/wav';
        var bytes = b64ToBytes(b64);
        if (mime.indexOf('L16') > -1 || mime.indexOf('pcm') > -1) {
          var rate = 24000;
          var at = mime.indexOf('rate=');
          if (at > -1) rate = parseInt(mime.slice(at + 5), 10) || 24000;
          return pcmToWav(bytes, rate);
        }
        return new Blob([bytes], { type: mime });
      });
    }).then(function (blob) {
      audioEl = new Audio(URL.createObjectURL(blob));
      audioEl.onplay = function () { setState('speak', 'Speaking'); };
      audioEl.onended = function () { setState('', 'Ready'); };
      return audioEl.play();
    }).catch(function () { browserSpeak(text); });
  }

  function reply(text, err) {
    push('jarvis', text, err);
    if (err) setState('', 'Ready'); else speak(text);
  }

  function has(t, w) { return t.indexOf(w) > -1; }

  function weather() {
    return new Promise(function (res) {
      if (!navigator.geolocation) return res('Is device par location available nahi hai.');
      navigator.geolocation.getCurrentPosition(function (p) {
        var la = p.coords.latitude, lo = p.coords.longitude;
        fetch('https://api.open-meteo.com/v1/forecast?latitude=' + la + '&longitude=' + lo + '&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m')
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var c = j.current;
            res('Abhi temperature ' + c.temperature_2m + '°C hai, humidity ' + c.relative_humidity_2m + '%, hawa ' + c.wind_speed_10m + ' km/h, barish ' + c.precipitation + ' mm.');
          }).catch(function () { res('Weather abhi nahi mil paaya. Thodi der baad try karo.'); });
      }, function () { res('Weather ke liye location permission chahiye. Browser settings mein allow karo.'); }, { timeout: 10000 });
    });
  }

  function battery() {
    if (!navigator.getBattery) return Promise.resolve('Is browser mein battery info available nahi hai.');
    return navigator.getBattery().then(function (b) {
      return 'Battery ' + Math.round(b.level * 100) + '% hai' + (b.charging ? ', charging chal rahi hai.' : '.');
    });
  }

  var quotes = [
    'Chhote steps roz lo, bada result khud banta hai.',
    'Jo aaj kaam karta hai, kal uska naam hota hai.',
    'Skill banao, paisa peeche aayega.',
    'Consistency talent se zyada door tak le jaati hai.',
    'Ek project poora karna, das idea sochne se behtar hai.'
  ];

  function notes() {
    var n = load('jarvis_notes', []);
    if (!n.length) return 'Abhi koi note nahi hai. "note: apna text" likh kar save karo.';
    return 'Tumhare notes:\n' + n.map(function (x, i) { return (i + 1) + '. ' + x; }).join('\n');
  }

  function local(raw) {
    var t = raw.toLowerCase().trim();
    if (t.indexOf('note:') === 0) {
      var body = raw.slice(raw.indexOf(':') + 1).trim();
      if (body) {
        var n = load('jarvis_notes', []); n.push(body); store('jarvis_notes', n);
        return Promise.resolve('Note save ho gaya.');
      }
    }
    if (t === 'clear notes' || t === 'delete notes') { store('jarvis_notes', []); return Promise.resolve('Saare notes delete ho gaye.'); }
    if (t === 'notes' || t === 'my notes' || t === 'show notes') return Promise.resolve(notes());
    if (t === 'time' || has(t, 'what time') || has(t, 'kitne baje') || has(t, 'time kya')) {
      return Promise.resolve('Abhi ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + ' baj rahe hain.');
    }
    if (t === 'date' || has(t, 'aaj ki date') || has(t, 'today date') || has(t, 'what date') || has(t, 'aaj kya din')) {
      return Promise.resolve('Aaj ' + new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + ' hai.');
    }
    if (has(t, 'weather') || has(t, 'mausam')) return weather();
    if (has(t, 'battery')) return battery();
    if (t === 'motivation' || has(t, 'motivate')) return Promise.resolve(quotes[Math.floor(Math.random() * quotes.length)]);
    if (t.indexOf('search ') === 0) {
      var q = raw.slice(7).trim();
      window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
      return Promise.resolve('Google par "' + q + '" search khol raha hoon.');
    }
    if (t.indexOf('maps ') === 0 || t.indexOf('map ') === 0) {
      var p = raw.slice(raw.indexOf(' ') + 1).trim();
      window.open('https://www.google.com/maps/search/' + encodeURIComponent(p), '_blank');
      return Promise.resolve('Maps par "' + p + '" khol raha hoon.');
    }
    return null;
  }

  function askAI(text) {
    var past = history.slice(-11, -1).map(function (h) {
      return { role: h.role === 'user' ? 'user' : 'model', text: h.text };
    });
    return fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: past })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || j.message || ('Server error ' + r.status));
        return j.reply || j.text || j.answer || j.message || 'Koi jawab nahi mila.';
      });
    });
  }

  function handle(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    busy = true;
    stopAudio();
    inp.value = '';
    push('user', text);
    setState('think', 'Soch raha hoon');
    var l = local(text);
    var p = l || askAI(text);
    p.then(function (ans) { reply(ans, false); })
     .catch(function (e) { reply('Error: ' + (e && e.message ? e.message : 'kuch galat hua') + '. Dobara try karo.', true); })
     .then(function () { busy = false; });
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false;
  if (SR) {
    rec = new SR();
    rec.lang = 'en-IN';
    rec.interimResults = false;
    rec.onresult = function (e) { handle(e.results[0][0].transcript); };
    rec.onend = function () { listening = false; micBtn.classList.remove('rec'); if (!busy) setState('', 'Ready'); };
    rec.onerror = function () { listening = false; micBtn.classList.remove('rec'); setState('', 'Mic kaam nahi kar raha. Permission check karo.'); };
  }
  micBtn.onclick = function () {
    if (!rec) { setState('', 'Is browser mein mic support nahi hai.'); return; }
    if (listening) { rec.stop(); return; }
    stopAudio();
    try { rec.start(); listening = true; micBtn.classList.add('rec'); setState('listen', 'Sun raha hoon'); } catch (e) {}
  };

  document.getElementById('send').onclick = function () { handle(inp.value); };
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') handle(inp.value); });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.onclick = function () { handle(c.getAttribute('data-c')); };
  });
  voiceBtn.onclick = function () {
    voiceOn = !voiceOn;
    voiceBtn.textContent = voiceOn ? 'Voice on' : 'Voice off';
    voiceBtn.classList.toggle('on', voiceOn);
    if (!voiceOn) { stopAudio(); setState('', 'Ready'); }
    store('jarvis_voice', voiceOn);
  };
  document.getElementById('clearBtn').onclick = function () {
    stopAudio(); history = []; store('jarvis_chat', []); render(); setState('', 'Ready');
  };

  voiceOn = load('jarvis_voice', true);
  voiceBtn.textContent = voiceOn ? 'Voice on' : 'Voice off';
  voiceBtn.classList.toggle('on', voiceOn);
  history = load('jarvis_chat', []);
  render();
})();
</script>
</body>
</html>
