<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#050b14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b14;--panel:#0b1626;--ink:#d6f3ff;--dim:#6f8ca3;--cyan:#2ee6ff;--amber:#ffb347;--line:#16314a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 28%,#0a2038,var(--bg) 60%);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif}
main{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;padding:20px 16px 16px}
h1{font-size:1.1rem;font-weight:600;margin:0;letter-spacing:.04em}
header{display:flex;justify-content:space-between;align-items:center}
#status{color:var(--dim);font-size:.85rem}
.orb-wrap{display:grid;place-items:center;padding:26px 0 18px}
button#orb{all:unset;cursor:pointer;width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center}
button#orb:focus-visible{outline:2px solid var(--amber);outline-offset:6px}
.ring{position:absolute;border-radius:50%;border:2px solid var(--cyan);opacity:.9}
.r1{inset:0;border-style:dashed;border-color:var(--line);border-width:3px}
.r2{inset:16px;border-color:var(--cyan);border-top-color:transparent;border-bottom-color:transparent}
.r3{inset:38px;border-color:var(--cyan);opacity:.5}
.core{width:44px;height:44px;border-radius:50%;background:var(--cyan);box-shadow:0 0 28px var(--cyan)}
[data-state=listening] .core{background:var(--amber);box-shadow:0 0 36px var(--amber)}
[data-state=listening] .r2,[data-state=listening] .r3{border-color:var(--amber)}
[data-state=thinking] .r2{animation:spin 1s linear infinite}
[data-state=speaking] .core{animation:pulse .5s ease-in-out infinite alternate}
[data-state=listening] .core{animation:pulse .9s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.35)}}
details{margin:0 0 10px;color:var(--dim);font-size:.88rem}
summary{cursor:pointer;padding:6px 0}
summary:focus-visible{outline:2px solid var(--cyan)}
.set{display:grid;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.set label{display:grid;gap:6px}
.set small{color:var(--dim)}
select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
select:focus-visible{outline:2px solid var(--cyan)}
input[type=range]{width:100%;accent-color:var(--cyan)}
.set button{justify-self:start;background:var(--cyan);color:#022;border:0;border-radius:10px;padding:9px 16px;font:inherit}
.set button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45;font-size:.97rem;overflow-wrap:anywhere}
.me{align-self:flex-end;background:#12385a}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.err{align-self:center;color:#ff8a8a;font-size:.88rem}
.msg a{color:var(--cyan)}
form{display:flex;gap:8px;margin-top:12px}
#text{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px;font:inherit}
#text:focus-visible{outline:2px solid var(--cyan)}
form button{background:var(--cyan);color:#022;border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
form button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-state="idle">
<main>
  <header><h1>Mini Jarvis</h1><span id="status">Tap karke bolo</span></header>
  <div class="orb-wrap">
    <button id="orb" aria-label="Mic on/off karo"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span></button>
  </div>
  <details>
    <summary>Settings</summary>
    <div class="set">
      <button type="button" id="wakeBtn">Hey Jarvis mode: Off</button>
      <small>On karne par "Jarvis, time kya hua" bolo. Page khula aur screen on rakhni padegi, battery zyada lagti hai.</small>
      <label>Voice
        <select id="voice"><option value="">Auto (best male voice)</option></select>
      </label>
      <label>Speed: <span id="rateVal">0.95</span>
        <input type="range" id="rate" min="0.6" max="1.6" step="0.05" value="0.95">
      </label>
      <label>Pitch: <span id="pitchVal">0.85</span>
        <input type="range" id="pitch" min="0.5" max="1.5" step="0.05" value="0.85">
      </label>
      <button type="button" id="testVoice">Awaaz sunao</button>
    </div>
  </details>
  <div id="log" aria-live="polite"></div>
  <form id="form"><input id="text" placeholder="Ya yahan type karo..." autocomplete="off"><button type="submit">Bhejo</button></form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), statusEl = $("status");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const HAS_TTS = "speechSynthesis" in window;
let history = [], busy = false, wakeOn = false, speaking = false, listening = false, rec = null;
const idle = () => (wakeOn ? "Hey Jarvis bolo..." : "Tap karke bolo");
function setState(s, label) { document.body.dataset.state = s; statusEl.textContent = label; }
function bubble(cls, text, url) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (url) {
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = " Kholo";
    d.appendChild(a);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

// ===== Voice settings =====
let prefs = { voice: "", rate: 0.95, pitch: 0.85 };
try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem("jarvis-voice2") || "{}")); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem("jarvis-voice2", JSON.stringify(prefs)); } catch (e) {} };
const voiceSel = $("voice"), rateEl = $("rate"), pitchEl = $("pitch");
rateEl.value = prefs.rate; pitchEl.value = prefs.pitch;
$("rateVal").textContent = Number(prefs.rate).toFixed(2);
$("pitchVal").textContent = Number(prefs.pitch).toFixed(2);

// natural / cinematic voices score higher
function score(v) {
  const n = v.name.toLowerCase(), l = v.lang;
  let s = 0;
  if (/^en-in/i.test(l)) s += 5; else if (/^en-gb/i.test(l)) s += 4; else if (/^hi/i.test(l)) s += 2; else if (/^en/i.test(l)) s += 1;
  if (/natural|neural|online/.test(n)) s += 6;
  if (/google/.test(n)) s += 3;
  if (/male|ravi|prabhat|daniel|arthur|rishi|hemant|george|ryan|guy|david/.test(n) && !/female/.test(n)) s += 4;
  return s;
}
function loadVoices() {
  if (!HAS_TTS) return;
  const list = speechSynthesis.getVoices().filter((v) => /^(hi|en)/i.test(v.lang)).sort((a, b) => score(b) - score(a));
  voiceSel.innerHTML = "";
  voiceSel.add(new Option("Auto (best male voice)", ""));
  list.forEach((v) => voiceSel.add(new Option(v.name + " (" + v.lang + ")", v.voiceURI)));
  voiceSel.value = prefs.voice;
  if (voiceSel.value !== prefs.voice) voiceSel.value = "";
}
if (HAS_TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  const all = speechSynthesis.getVoices();
  if (prefs.voice) { const v = all.find((x) => x.voiceURI === prefs.voice); if (v) return v; }
  return all.filter((v) => /^(hi|en)/i.test(v.lang)).sort((a, b) => score(b) - score(a))[0] || null;
}
voiceSel.onchange = () => { prefs.voice = voiceSel.value; savePrefs(); };
rateEl.oninput = () => { prefs.rate = Number(rateEl.value); $("rateVal").textContent = prefs.rate.toFixed(2); savePrefs(); };
pitchEl.oninput = () => { prefs.pitch = Number(pitchEl.value); $("pitchVal").textContent = prefs.pitch.toFixed(2); savePrefs(); };
$("testVoice").onclick = () => speak("Namaste. Main Jarvis hoon. Boliye, main aapki kya madad kar sakta hoon?");

// ===== Speaking (sentence by sentence, sounds more natural) =====
function speak(text) {
  if (!HAS_TTS) { done(); return; }
  speechSynthesis.cancel();
  const clean = text.replace(/[*_`#>~]/g, "").replace(/https?:\/\/\S+/g, "link").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "").trim();
  const parts = clean.match(/[^.!?।\n]+[.!?।]?/g) || [clean];
  if (rec) { try { rec.abort(); } catch (e) {} }
  speaking = true;
  setState("speaking", "Bol raha hoon...");
  const v = pickVoice();
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-IN";
    u.rate = prefs.rate; u.pitch = prefs.pitch;
    if (i === parts.length - 1) { u.onend = done; u.onerror = done; }
    speechSynthesis.speak(u);
  });
}
function done() {
  speaking = false;
  setState("idle", idle());
  if (wakeOn) startRec();
}

// ===== Commands =====
function notes() { try { return JSON.parse(localStorage.getItem("jv_notes") || "[]"); } catch (e) { return []; } }
function jarvisCommand(raw) {
  const t = raw.toLowerCase().trim();
  let m;
  if ((m = t.match(/(?:note (?:karo|kar|down)|note this|yaad rakho|remember)\s*[:,-]?\s*(.+)/))) {
    const n = notes(); n.push(m[1]);
    try { localStorage.setItem("jv_notes", JSON.stringify(n)); } catch (e) {}
    return { text: "Note kar liya: " + m[1] };
  }
  if (/(mere notes|show notes|notes dikhao|notes padho|read notes)/.test(t)) {
    const n = notes();
    return { text: n.length ? "Aapke notes: " + n.map((x, i) => (i + 1) + ". " + x).join(". ") : "Abhi koi note nahi hai." };
  }
  if (/notes? (delete|clear|saaf|hatao)/.test(t)) {
    try { localStorage.removeItem("jv_notes"); } catch (e) {}
    return { text: "Saare notes delete kar diye." };
  }
  if ((m = t.match(/(?:\bmaps?\b|navigate|route|raasta)(?: me| mein| pe| par| to| for)?\s+(.+)/))) {
    return { text: "Maps mein khol raha hoon: " + m[1], url: "https://www.google.com/maps/search/" + encodeURIComponent(m[1]) };
  }
  if ((m = t.match(/(?:search|google|dhundo|khojo)(?: karo| kar| for)?\s+(.+)/))) {
    return { text: "Search kar raha hoon: " + m[1], url: "https://www.google.com/search?q=" + encodeURIComponent(m[1]) };
  }
  if (/(\bdate\b|tarikh|tareekh|aaj kaun sa din|which day)/.test(t)) {
    return { text: "Aaj " + new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + " hai." };
  }
  if (/(\btime\b|samay|waqt|kitne baje)/.test(t)) {
    return { text: "Abhi " + new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", hour12: true }) + " baje hain." };
  }
  return null;
}

// ===== Gemini via Netlify function =====
async function callAI(text) {
  const post = (h) => fetch("/.netlify/functions/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, text: text, prompt: text, history: h })
  });
  let r = await post(history);
  if (!r.ok) r = await post([]);
  const raw = await r.text();
  let d; try { d = JSON.parse(raw); } catch (e) { d = raw; }
  if (!r.ok) throw new Error((d && (d.error || d.message)) || "Server error " + r.status);
  return typeof d === "string" ? d : (d.reply || d.text || d.message || d.response || d.output || d.answer || JSON.stringify(d));
}

async function ask(text) {
  if (busy || !text) return;
  busy = true;
  bubble("me", text);
  setState("thinking", "Soch raha hoon...");
  try {
    const cmd = jarvisCommand(text);
    let reply, url;
    if (cmd) {
      reply = cmd.text; url = cmd.url;
      if (url) window.open(url, "_blank");
    } else {
      reply = await callAI(text);
      history.push({ role: "user", content: text }, { role: "assistant", content: reply });
      history = history.slice(-20);
    }
    bubble("ai", reply, url);
    busy = false;
    speak(reply);
  } catch (e) {
    busy = false;
    bubble("err", "Problem: " + e.message);
    setState("idle", idle());
    if (wakeOn) startRec();
  }
}

// ===== Mic =====
function startRec() {
  if (!SR || listening || busy || speaking) return;
  rec = new SR();
  rec.lang = "en-IN";
  rec.interimResults = false;
  rec.continuous = wakeOn;
  rec.onstart = () => { listening = true; setState("listening", wakeOn ? "Hey Jarvis bolo..." : "Sun raha hoon..."); };
  rec.onresult = (e) => heard(e.results[e.results.length - 1][0].transcript.trim());
  rec.onerror = () => {};
  rec.onend = () => {
    listening = false;
    if (wakeOn && !busy && !speaking) setTimeout(startRec, 300);
    else if (!busy && !speaking) setState("idle", idle());
  };
  try { rec.start(); } catch (e) {}
}
function heard(t) {
  if (!wakeOn) return ask(t);
  const m = t.match(/j[ae]r?[wv]is/i);
  if (!m) return;
  const rest = t.slice(m.index + m[0].length).replace(/^[\s,.:-]+/, "");
  if (rest) ask(rest); else { bubble("ai", "Ji, boliye."); speak("Ji, boliye."); }
}
$("orb").onclick = () => {
  if (!SR) { bubble("err", "Is browser mein mic support nahi hai. Chrome use karo."); return; }
  if (speaking) { speechSynthesis.cancel(); done(); return; }
  if (listening) { try { rec.stop(); } catch (e) {} return; }
  startRec();
};
$("wakeBtn").onclick = () => {
  wakeOn = !wakeOn;
  $("wakeBtn").textContent = "Hey Jarvis mode: " + (wakeOn ? "On" : "Off");
  if (wakeOn) startRec(); else { if (rec) { try { rec.abort(); } catch (e) {} } setState("idle", idle()); }
};
$("form").onsubmit = (e) => { e.preventDefault(); const v = $("text").value.trim(); $("text").value = ""; ask(v); };
</script>
</body>
</html>
